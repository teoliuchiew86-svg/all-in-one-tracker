<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trackers</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; height:100vh; display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#e9edec;
  }
  .switcher{
    display:flex; gap:8px; padding:10px 14px;
    background:#12312d; box-shadow:0 2px 8px rgba(0,0,0,.15);
    flex-shrink:0;
  }
  .switcher button{
    flex:1; max-width:260px;
    border:1.5px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .switcher button:hover{ background:rgba(255,255,255,.16); }
  .switcher button.active{
    background:#fff;
    color:#12312d;
    border-color:#fff;
  }
  .frames{ flex:1; position:relative; }
  iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:none;
    display:none;
    background:#fff;
  }
  iframe.active{ display:block; }
</style>
</head>
<body>

<div class="switcher">
  <button id="btn-followup" class="active" onclick="showFrame('followup')">Follow-Up Tracker</button>
  <button id="btn-outlet" onclick="showFrame('outlet')">Outlet Coverage Tracker</button>
  <button id="btn-device" onclick="showFrame('device')">Health Screening Device</button>
  <button id="btn-cme" onclick="showFrame('cme')">CME Tracker</button>
</div>

<div class="frames">
  <iframe id="frame-followup" class="active" src="follow-up-tracker.html"></iframe>
  <iframe id="frame-outlet" src="outlet-coverage-tracker.html"></iframe>
  <iframe id="frame-device" src="https://teoliuchiew86-svg.github.io/Outlet-Device/"></iframe>
  <iframe id="frame-cme" src="cme-tracker.html"></iframe>
</div>

<script>
const frames = ['followup','outlet','device','cme'];
function showFrame(name){
  frames.forEach(f=>{
    document.getElementById('frame-'+f).classList.toggle('active', f===name);
    document.getElementById('btn-'+f).classList.toggle('active', f===name);
  });
}
</script>

</body>
</html>
